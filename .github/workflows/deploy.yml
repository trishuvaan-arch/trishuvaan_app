name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ---------------- FRONTEND BUILD ----------------
      - name: Install & Build Frontend
        run: |
          npm install
          npm run build

      # Zip frontend build folder
      - name: Zip Frontend Build
        run: zip -r dist.zip dist/

      # ---------------- BACKEND BUILD ----------------
      - name: Zip Backend Folder
        run: |
          cd server
          zip -r server.zip .

      # ---------------- COPY FILES TO VPS ----------------
      - name: Upload build artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist.zip, server/server.zip"
          target: "~/ci_cd_uploads"

      # ---------------- RUN DEPLOY SCRIPT ON VPS ----------------
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "📦 Starting Deployment..."

            cd ~/ci_cd_uploads

            echo "🟣 Extracting Frontend Build..."
            unzip -o dist.zip -d ~/trishuvaan_app/frontend_tmp
            sudo rm -rf /var/www/myapp/*
            sudo cp -r ~/trishuvaan_app/frontend_tmp/dist/* /var/www/myapp/

            echo "🟢 Extracting Backend..."
            unzip -o server.zip -d ~/trishuvaan_app/server

            cd ~/trishuvaan_app/server
            npm install --production

            echo "🔁 Restarting PM2 backend..."
            pm2 restart backend || pm2 start index.js --name backend

            echo "🌐 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "🎉 Deployment Successful!"
