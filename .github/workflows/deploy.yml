name: Deploy Trishuvaan to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- CHECKOUT ----------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ---------- FRONTEND BUILD ----------
      - name: Install & Build Frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          npm install
          npm run build

      - name: Zip Frontend Build
        run: zip -r frontend.zip dist/

      # ---------- BACKEND ZIP ----------
      - name: Zip Backend
        run: |
          cd server
          zip -r backend.zip .

      # ---------- UPLOAD TO VPS ----------
      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend.zip, server/backend.zip"
          target: "/home/govind/ci_cd_uploads"

      # ---------- DEPLOY ON VPS ----------
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting Deployment"

            cd /home/govind/ci_cd_uploads

            # ---------- FRONTEND ----------
            echo "🟣 Deploying Frontend"
            rm -rf /tmp/frontend_tmp
            mkdir -p /tmp/frontend_tmp
            unzip -o frontend.zip -d /tmp/frontend_tmp

            sudo rm -rf /var/www/trishuvaan/*
            sudo cp -r /tmp/frontend_tmp/dist/* /var/www/trishuvaan/

            # ---------- BACKEND ----------
            echo "🟢 Deploying Backend"

            mkdir -p /home/govind/trishuvaan_app/server

            if [ -f /home/govind/trishuvaan_app/server/.env ]; then
              cp /home/govind/trishuvaan_app/server/.env /tmp/server_env_backup
            fi

            rm -rf /home/govind/trishuvaan_app/server/*
            unzip -o /home/govind/ci_cd_uploads/server/backend.zip -d /home/govind/trishuvaan_app/server

            if [ -f /tmp/server_env_backup ]; then
              mv /tmp/server_env_backup /home/govind/trishuvaan_app/server/.env
            fi

            cd /home/govind/trishuvaan_app/server
            npm install --production

            pm2 restart backend || pm2 start index.js --name backend
            pm2 save

            sudo systemctl reload nginx

            echo "🎉 Deployment Complete!"
