name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- CHECKOUT ----------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ---------- FRONTEND BUILD ----------
      - name: Install & Build Frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          npm install
          npm run build

      - name: Zip Frontend Build
        run: zip -r frontend.zip dist/

      # ---------- BACKEND ZIP ----------
      - name: Zip Backend
        run: |
          cd server
          zip -r backend.zip .

      # ---------- SEND FILES TO VPS ----------
      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend.zip, server/backend.zip"
          target: "~/ci_cd_uploads"

      # ---------- DEPLOY ON VPS ----------
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Starting Deployment"

            cd ~/ci_cd_uploads

            # ---------- FRONTEND DEPLOY ----------
            echo "🟣 Deploying Frontend"
            rm -rf ~/frontend_tmp
            mkdir ~/frontend_tmp
            unzip -o frontend.zip -d ~/frontend_tmp

            sudo rm -rf /var/www/myapp/*
            sudo cp -r ~/frontend_tmp/dist/* /var/www/myapp/

            # ---------- BACKEND DEPLOY ----------
            echo "🟢 Deploying Backend"

            # Backup existing .env
            if [ -f ~/trishuvaan_app/server/.env ]; then
              cp ~/trishuvaan_app/server/.env ~/server_env_backup
            fi

            rm -rf ~/trishuvaan_app/server/*
            
            echo "📦 Extracting backend.zip"
            unzip -o ~/ci_cd_uploads/server/backend.zip -d ~/trishuvaan_app/server

            # Restore .env
            if [ -f ~/server_env_backup ]; then
              mv ~/server_env_backup ~/trishuvaan_app/server/.env
            fi

            cd ~/trishuvaan_app/server
            npm install

            echo "🔁 Restarting PM2 Backend..."
            pm2 restart backend || pm2 start index.js --name backend

            echo "🌐 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "🎉 Deployment Complete!"
