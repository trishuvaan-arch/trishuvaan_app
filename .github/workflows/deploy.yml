name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ---------- FRONTEND ----------
      - name: Install & Build Frontend
        run: |
          npm install
          npm run build

      - name: Zip Frontend Build
        run: zip -r frontend.zip dist/

      # ---------- BACKEND ----------
      - name: Zip Backend
        run: |
          cd server
          zip -r backend.zip .

      # ---------- SEND FILES ----------
      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend.zip, server/backend.zip"
          target: "~/ci_cd_uploads"

      # ---------- DEPLOY ON VPS ----------
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Starting Deployment"

            cd ~/ci_cd_uploads

            # ----- FRONTEND -----
            echo "🟣 Deploying Frontend"
            rm -rf ~/frontend_tmp
            mkdir ~/frontend_tmp
            unzip -o frontend.zip -d ~/frontend_tmp

            sudo rm -rf /var/www/myapp/*
            sudo cp -r ~/frontend_tmp/dist/* /var/www/myapp/

            # ----- BACKEND -----
            echo "🟢 Deploying Backend"
            rm -rf ~/trishuvaan_app/server/*
            unzip -o backend.zip -d ~/trishuvaan_app/server

            cd ~/trishuvaan_app/server
            npm install   # not --production

            pm2 restart backend || pm2 start index.js --name backend

            echo "🔁 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "🎉 Deployment Complete!"
